[project]
name = "daedalus"
version = "0.0.1"
description = "Single-user, local-first chief-of-staff agent"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "discord.py>=2.4",
    "tomli-w>=1.0",
    "cryptography>=43",
]

[project.scripts]
daedalus = "daedalus.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# discord.py still calls asyncio.iscoroutinefunction, deprecated in 3.14. Not
# our code and not actionable from here -- ignore that message only, so a real
# warning in a run of 52 tests is not buried under fourteen copies of this one.
filterwarnings = ["ignore:.*iscoroutinefunction.*:DeprecationWarning"]
